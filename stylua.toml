# StyLua configuration for this Neovim config.
#
# Discovered automatically by the stylua CLI, by none-ls (lua/plugins/none-ls.lua),
# and by the JetBrains Luau plugin (.idea/luauPlugin.xml, runStyLua=RunOnSave),
# so every entry point formats identically.
#
# NOTE: CLI flags override this file. Do not pass --indent-width/--indent-type
# from none-ls or the settings here become dead config.

column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"

# Keep `require("mod")` rather than rewriting to `require "mod"`. The codebase
# is uniformly parenthesised and CLAUDE.md documents calls in that form.
call_parentheses = "Always"

# Never join `if x then return end` onto one line — keeps guard clauses and
# lazy.nvim spec tables diffing cleanly line-by-line.
collapse_simple_statement = "Never"

[sort_requires]
# Requires here are order-sensitive (init.lua loads config modules before
# plugins; lua/plugins/init.lua documents that import order matters).
enabled = false
